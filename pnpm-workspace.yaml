packages:
  - docs
  - interface
  - emails
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false

supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc

# monetr only builds and runs on glibc. supportedArchitectures above keeps these from being installed, but pnpm still
# records every platform in the lockfile unless the package is removed from the dependency tree here.
overrides:
  '@biomejs/cli-linux-arm64-musl': '-'
  '@biomejs/cli-linux-x64-musl': '-'
  '@img/sharp-libvips-linuxmusl-arm64': '-'
  '@img/sharp-libvips-linuxmusl-x64': '-'
  '@img/sharp-linuxmusl-arm64': '-'
  '@img/sharp-linuxmusl-x64': '-'
  '@parcel/watcher-linux-arm-musl': '-'
  '@parcel/watcher-linux-arm64-musl': '-'
  '@parcel/watcher-linux-x64-musl': '-'
  '@resvg/resvg-js-linux-arm64-musl': '-'
  '@resvg/resvg-js-linux-x64-musl': '-'
  '@rspack/binding-linux-arm64-musl': '-'
  '@rspack/binding-linux-riscv64-musl': '-'
  '@rspack/binding-linux-x64-musl': '-'
  sass-embedded-linux-musl-arm: '-'
  sass-embedded-linux-musl-arm64: '-'
  sass-embedded-linux-musl-riscv64: '-'
  sass-embedded-linux-musl-x64: '-'

saveExact: true
savePrefix: ""

preferFrozenLockfile: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # @types/node@20 depends on undici-types@~6.21.0, but undici-types@6.x was
  # republished without provenance after earlier versions had it, so it trips
  # the no-downgrade policy. See https://github.com/nodejs/undici/issues/4666
  - 'undici-types@6.21.0'
  # sass@1.99.0 depends on chokidar@^4.0.0, but chokidar@4.0.2 and 4.0.3 were
  # published without provenance (returns in 5.0.0, out of the ^4 range), so it
  # trips no-downgrade. See https://github.com/paulmillr/chokidar/issues/1440
  - 'chokidar@4.0.3'
  # @rspress/core (docs) pulls react-render-to-markdown; 19.x dropped its
  # trusted-publisher signal with no in-range replacement. See
  # https://github.com/SoonIter/react-render-to-markdown/issues/1
  - 'react-render-to-markdown@19.0.1'
  # widely-used transitive dep; 6.3.x predates/regressed npm provenance and has
  # no in-range replacement. See https://github.com/npm/node-semver/issues/838
  - 'semver@6.3.1'
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@monetr/*'

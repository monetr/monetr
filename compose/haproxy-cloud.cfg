global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 600s
    timeout server 30s
    timeout tunnel 1h

frontend http
    bind :80

    unique-id-format %[uuid()]

    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http

    use_backend monetr if { path_beg /api }
    use_backend ui_ws if { path_beg /ws }
    use_backend mail if { path_beg /mail/ }
    default_backend ui

backend monetr
    http-request set-header X-Request-Id %[unique-id]
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 5242880 }
    server monetr monetr:4000

backend ui_ws
    server ui ui:3000

backend mail
    timeout server 600s
    http-request replace-path ^/mail(.*)$ \1
    server mail mail:8025

backend ui
    timeout server 600s
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Referrer-Policy "same-origin"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=(), clipboard-read=(), clipboard-write=(self), gamepad=(), speaker-selection=()"
    server ui ui:3000
